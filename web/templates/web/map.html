{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Safety &amp; Protest Mapper — Paris / Dublin</title>

  <!-- Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    crossorigin="anonymous"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <!-- Custom styles -->
  <link rel="stylesheet" href="{% static 'web/css/map.css' %}">
</head>
<body>

  <!-- ===== Full-Screen Map ===== -->
  <div id="map"></div>

  <!-- ===== Legend (bottom-right, above Leaflet attribution) ===== -->
  <div id="legend" class="leaflet-control">
    <h6 class="mb-2 fw-semibold">
      <i class="bi bi-layers-fill me-1"></i>Legend
    </h6>
    <div class="legend-item">
      <span class="legend-swatch peaceful-swatch"></span>
      <span>Peaceful Protest</span>
    </div>
    <div class="legend-item mt-1">
      <span class="legend-swatch violent-swatch"></span>
      <span>Violent Incident</span>
    </div>
    <hr class="my-2">
    <div class="text-muted" style="font-size:0.7rem;">
      <i class="bi bi-circle me-1"></i>Pin &nbsp;·&nbsp;
      <i class="bi bi-circle-fill opacity-50 me-1"></i>100 m buffer
    </div>
  </div>

  <!-- ===== Pin-Count Badge (top-right) ===== -->
  <div id="pin-count-badge" class="badge bg-dark bg-opacity-75 text-white px-3 py-2">
    <i class="bi bi-geo-alt-fill me-1"></i>
    Pins: <span id="pin-count">0</span>
  </div>

  <!-- ===== Click-to-Drop Modal ===== -->
  <div
    class="modal fade"
    id="dropPinModal"
    tabindex="-1"
    aria-labelledby="dropPinModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">

        <div class="modal-header">
          <h5 class="modal-title" id="dropPinModalLabel">
            <i class="bi bi-geo-alt-fill me-2 text-primary"></i>Drop a Safety Pin
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">

          <!-- Coordinates display -->
          <div class="alert alert-secondary d-flex align-items-center py-2 mb-3" role="alert">
            <i class="bi bi-crosshair me-2"></i>
            <small>
              Lat: <strong id="modal-lat">—</strong>
              &nbsp;·&nbsp;
              Lng: <strong id="modal-lng">—</strong>
            </small>
          </div>

          <form id="drop-pin-form" novalidate>
            {% csrf_token %}

            <!-- Category -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
              <div class="d-flex gap-3">
                <div class="form-check form-check-inline flex-fill">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    id="cat-peaceful"
                    value="PEACEFUL"
                    required
                    checked
                  >
                  <label class="form-check-label" for="cat-peaceful">
                    <span class="badge rounded-pill text-bg-primary">
                      <i class="bi bi-peace me-1"></i>Peaceful
                    </span>
                  </label>
                </div>
                <div class="form-check form-check-inline flex-fill">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="category"
                    id="cat-violent"
                    value="VIOLENT"
                    required
                  >
                  <label class="form-check-label" for="cat-violent">
                    <span class="badge rounded-pill text-bg-danger">
                      <i class="bi bi-exclamation-triangle-fill me-1"></i>Violent
                    </span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Title -->
            <div class="mb-3">
              <label for="pin-title" class="form-label fw-semibold">
                Title <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="pin-title"
                name="title"
                maxlength="200"
                placeholder="e.g. Peaceful March on O'Connell St"
                required
              >
              <div class="invalid-feedback">Please enter a title.</div>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="pin-description" class="form-label fw-semibold">Description</label>
              <textarea
                class="form-control"
                id="pin-description"
                name="description"
                rows="3"
                placeholder="Brief description of the incident or event…"
              ></textarea>
            </div>

            <!-- API error / info -->
            <div id="form-alert" class="alert d-none" role="alert"></div>
          </form>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </button>
          <button type="button" class="btn btn-primary" id="submit-pin-btn">
            <span
              id="submit-spinner"
              class="spinner-border spinner-border-sm me-1 d-none"
              role="status"
              aria-hidden="true"
            ></span>
            <i class="bi bi-pin-map-fill me-1" id="submit-icon"></i>Drop Pin
          </button>
        </div>

      </div>
    </div>
  </div>
  <!-- /Modal -->

  <!-- ===== Scripts ===== -->
  <!-- Bootstrap 5 JS (bundle includes Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <!-- Map logic -->
  <script src="{% static 'web/js/map.js' %}"></script>
</body>
</html>
